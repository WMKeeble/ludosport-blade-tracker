<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blade Tracker Debug Viewer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Blade Tracker Debug Viewer</h1>
    <p id="status">Loading...</p>
  </header>

  <main id="grid" class="grid"></main>

  <script>
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const cards = new Map();

    async function loadImages() {
        const response = await fetch(`/api/images?t=${Date.now()}`);
        const images = await response.json();
        const currentImages = new Set(images);

        // Remove cards for deleted images
        for (const [name, card] of cards.entries()) {
            if (!currentImages.has(name)) {
                card.remove();
                cards.delete(name);
            }
        }

        // Add/update cards
        for (const image of images) {
            let card = cards.get(image);

            if (!card) {
                card = document.createElement("section");
                card.className = "card";

                const title = document.createElement("h2");
                title.textContent = image;

                const img = document.createElement("img");
                img.alt = image;

                card.appendChild(title);
                card.appendChild(img);
                grid.appendChild(card);

                cards.set(image, card);
            }

            const img = card.querySelector("img");
            img.src = `/debug/${image}?t=${Date.now()}`;
        }

        status.textContent = `${images.length} debug image(s) loaded`;
        }

        loadImages();
        setInterval(loadImages, 1000);
    </script>  
</body>
</html>
